[project]
requires-python = "~=3.14.0"
name = "bagtester"
version = "0.4.0"

[tool.black]
line-length = 120

[tool.isort]
profile = "black"

[tool.mypy]
python_version = 3.14
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
exclude = "src/_unused/"

[[tool.mypy.overrides]]
module = [ "mplfinance.*", "yfinance.*"]
ignore_missing_imports = true

[tool.pytest]
testpaths = ["inttests"]
pythonpath = ["src"]
